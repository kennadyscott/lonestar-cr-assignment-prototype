<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoneStar CR Assignment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d4257;
    --navy-2: #125570;
    --cyan: #1fb3de;
    --cyan-soft: #d9f2fb;
    --cyan-softer: #eef9fd;
    --bg: #f3f8fb;
    --surface: #ffffff;
    --border: #dfe9ef;
    --text: #1d2b33;
    --muted: #5d7280;
    --sand: #fdf6ea;
    --sand-border: #f0dcb8;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(13,66,87,.05), 0 4px 16px rgba(13,66,87,.05);
  }
  /* Grade band font scale: 2–3 = base, 4–5 smaller, 6–8 smaller still */
  body { --fs: 1; }
  body[data-band="4-5"] { --fs: .9; }
  body[data-band="6-8"] { --fs: .9; }   /* 4–5 size is the floor */
  body[data-band="9-12"] { --fs: .9; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Manrope", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: calc(16px * var(--fs));
    line-height: 1.65;
    display: flex; flex-direction: column;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Top bar — copied from LoneStar Writing Studio V1 (src/theme.css + Shell.jsx) ---------- */
  .topbar {
    --v1-navy-deep: #01172d; --v1-navy: #02384d; --v1-teal: #035c78; --v1-ink: #14344a;
    --v1-muted: #5c7285; --v1-line: #dde8ee; --v1-gold: #f5b400; --v1-gold-line: rgba(245, 180, 0, 0.45);
    font-family: 'Manrope', system-ui, sans-serif; line-height: normal;
    flex: none;
    background: rgba(255,255,255,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--v1-gold-line); padding: 0 20px 0 16px; display: flex; align-items: center; gap: 14px; min-height: 64px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  }
  .topbar button { font-family: inherit; cursor: pointer; border: none; background: none; }
  .logo-chip { background: linear-gradient(150deg, var(--v1-navy) 0%, var(--v1-navy-deep) 100%) !important; border-radius: 12px; padding: 5px 12px; margin: 8px 0; display: grid; place-items: center; }
  .logo-chip img { height: 36px; display: block; }
  .cc-btn { display: flex; align-items: center; gap: 10px; background: #fff !important; border: 1px solid var(--v1-gold-line) !important; border-radius: 999px; padding: 5px 12px 5px 8px; }
  .cc-btn:hover { border-color: var(--v1-gold) !important; background: #fffdf6 !important; }
  .cc-btn img { height: 22px; }
  .cc-btn .split { width: 1px; height: 22px; background: var(--v1-line); }
  .cc-btn small { display: block; font-size: 9px; font-weight: 700; letter-spacing: .7px; color: var(--v1-muted); text-align: left; }
  .cc-btn b { font-size: 13px; color: var(--v1-ink); display: block; text-align: left; font-weight: 700; }
  .who { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--v1-gold-line); border-radius: 999px; padding: 4px 10px 4px 4px; }
  .who .av-init { width: 32px; height: 32px; border-radius: 50%; background: #d9f2fb; color: var(--v1-teal); display: grid; place-items: center; font-weight: 800; font-size: 12px; border: 1.5px solid var(--v1-gold); }
  .who .nm { font-weight: 700; font-size: 13.5px; line-height: 1.15; color: var(--v1-ink); }
  .who .sub { font-size: 11.5px; color: var(--v1-muted); }
  .who .pwr { font-size: 16px; color: var(--v1-muted); padding: 4px; }
  .who .pwr:hover { color: var(--v1-ink); }
  .spacer { flex: 1; }
  /* Prototype-only grade band switcher */
  .band { display: flex; align-items: center; gap: 4px; background: #fff; border: 1px solid var(--v1-gold-line); border-radius: 999px; padding: 4px; margin-left: 6px; }
  .band span { font-size: 10px; font-weight: 800; letter-spacing: .7px; color: var(--v1-muted); padding: 0 6px 0 8px; }
  .topbar .band button { height: 28px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--v1-ink); }
  .topbar .band button:hover { background: #eef6fa; }
  .topbar .band button.on { background: var(--v1-navy); color: #fff; }

  /* Prototype-only controls, kept out of the real student header */
  .proto-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 20px; background: #fff8e6; border-bottom: 1px solid var(--v1-gold-line, #f0dcb8); font-family: 'Manrope', system-ui, sans-serif; }
  .proto-bar > strong { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #8a6a1c; margin-right: 4px; }
  .proto-bar .band { --v1-gold-line: rgba(245, 180, 0, 0.45); --v1-muted: #5c7285; --v1-ink: #14344a; --v1-navy: #02384d; display: flex; align-items: center; gap: 4px; background: #fff; border: 1px solid var(--v1-gold-line); border-radius: 999px; padding: 4px; margin: 0; }
  .proto-bar .band span { font-size: 10px; font-weight: 800; letter-spacing: .7px; color: var(--v1-muted); padding: 0 6px 0 8px; }
  .proto-bar .band button { height: 28px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: var(--v1-ink); border: 0; background: none; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .proto-bar .band button:hover { background: #eef6fa; }
  .proto-bar .band button.on { background: var(--v1-navy); color: #fff; }

  /* ---------- Assignment bar (matches the current app: title left, Save And Exit right) ---------- */
  .assign-bar { flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 20px 0; }
  .assign-bar h1 { margin: 0; font-size: 20px; font-weight: 500; color: var(--navy); line-height: 1.2; }
  .save-btn { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--navy); color: #fff; font-size: 13.5px; font-weight: 500; }
  .save-btn:hover { background: var(--navy-2); }

  /* ---------- Layout ---------- */
  .workspace {
    display: grid; align-items: start;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) var(--luna-w, 280px);
    gap: 20px;
    padding: 20px;
    transition: grid-template-columns .25s ease;
  }
  body.luna-collapsed .workspace { --luna-w: 72px; }
  /* Page scrolls now. The passage panel grows to ~2 screens tall before scrolling inside;
     the response + Luna panels stick below the header so they stay in view while reading. */
  .workspace > .panel:first-child { max-height: calc(2 * (100vh - 150px)); }
  .workspace > .panel:not(:first-child) { position: sticky; top: 84px; max-height: calc(100vh - 104px); }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); min-height: 0;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-head {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { margin: 0; font-size: calc(15px * var(--fs)); font-weight: 600; color: var(--navy); }
  .eyebrow { font-size: calc(11px * var(--fs)); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .panel-body { flex: 1; overflow-y: auto; padding: 24px 28px; }

  /* Passage */
  .passage p { margin: 0 0 1.1em; max-width: 64ch; }
  .passage .pnum { display: inline-block; min-width: 1.6em; color: var(--cyan); font-weight: 600; font-size: calc(14px * var(--fs)); }
  /* Collapsible passage sections (used when an assignment has 2+ passages) */
  .psg { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 14px; background: var(--surface); }
  .psg > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: 10px; font-family: "Manrope", system-ui, sans-serif; font-size: calc(16px * var(--fs));
  }
  .psg > summary::-webkit-details-marker { display: none; }
  .psg > summary:hover { background: var(--cyan-softer); }
  .psg[open] > summary { border-bottom: 1px solid var(--border); border-radius: 10px 10px 0 0; }
  .psg .num { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; font-size: calc(13px * var(--fs)); font-weight: 600; display: grid; place-items: center; flex: none; }
  .psg .ttl { font-weight: 600; color: var(--navy); flex: 1; line-height: 1.3; }
  .psg .chev { flex: none; color: var(--muted); transition: transform .2s; }
  .psg[open] .chev { transform: rotate(180deg); }
  .psg .psg-body { padding: 16px 18px 4px; }
  .psg-toggle { background: none; border: 0; padding: 0; color: var(--navy-2); font-size: calc(13px * var(--fs)); font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
  .psg-actions { display: flex; justify-content: flex-end; margin: -6px 0 10px; }

  /* Passage toolbar (matches the current app, with zoom moved in from the top) */
  .passage-bar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .passage-pill { display: flex; align-items: center; gap: 18px; min-height: 44px; padding: 8px 16px; border-radius: 6px; background: #f1f3f4; border: 1px solid #e3e6e8; flex: 1 1 220px; min-width: 0; }
  .passage-pill span { color: var(--muted); }
  .passage-pill b { font-weight: 500; color: var(--text); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: flex; flex-wrap: nowrap; gap: 6px; }
  .tool { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; font-size: calc(13.5px * var(--fs)); white-space: nowrap; border-radius: 6px; border: 1.5px solid var(--navy); background: var(--cyan-softer); color: var(--navy); }
  .tool:hover, .tool.on { background: var(--cyan-soft); }
  .tool.icon { width: 34px; padding: 0; justify-content: center; }
  .tool svg { width: 15px; height: 15px; }
  .zoom { display: inline-flex; border-radius: 6px; overflow: hidden; border: 1.5px solid var(--navy); }
  .zoom button { width: 32px; height: 31px; border: 0; background: var(--cyan-softer); color: var(--navy); display: grid; place-items: center; }
  .zoom button + button { border-left: 1.5px solid var(--navy); }
  .zoom button:hover { background: var(--cyan-soft); }
  .zoom button:active { background: var(--cyan); }
  .zoom svg { width: 16px; height: 16px; }
  body.line-reader .passage p { opacity: .3; transition: opacity .15s; }
  body.line-reader .passage p:hover { opacity: 1; background: var(--cyan-softer); border-radius: 6px; }

  /* Prompt + steps */
  .prompt-card { background: var(--cyan-softer); border: 1px solid var(--cyan-soft); border-radius: 12px; padding: 16px 18px; margin-bottom: 22px; }
  .prompt-card .q { font-size: calc(17px * var(--fs)); font-weight: 500; color: var(--navy); margin: 6px 0 0; line-height: 1.5; }
  .prompt-card details { margin-top: 10px; font-size: calc(14px * var(--fs)); color: var(--muted); }
  .prompt-card summary { cursor: pointer; color: var(--navy-2); font-weight: 500; }

  .stepper { display: flex; gap: 6px; margin-bottom: 18px; }
  .stepper button {
    flex: 1; border: 0; background: none; padding: 0; text-align: left;
    font-size: calc(12px * var(--fs)); color: var(--muted);
  }
  .stepper .bar { height: 5px; border-radius: 3px; background: var(--border); margin-bottom: 6px; }
  .stepper button.done .bar { background: var(--navy-2); }
  .stepper button.active .bar { background: var(--cyan); }
  .stepper button.active { color: var(--navy); font-weight: 600; }

  .step h3 { margin: 0 0 4px; font-size: calc(18px * var(--fs)); color: var(--navy); font-weight: 600; }
  .step .instr { color: var(--muted); margin: 0 0 16px; }
  .checklist { list-style: none; margin: 0 0 20px; padding: 0; display: grid; gap: 10px; }
  .checklist li { display: flex; gap: 12px; align-items: flex-start; background: var(--sand); border: 1px solid var(--sand-border); border-radius: 10px; padding: 12px 14px; }
  .checklist input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--navy-2); flex: none; }
  .field-label { font-size: calc(14px * var(--fs)); font-weight: 500; color: var(--navy); margin: 0 0 6px; display: block; }
  textarea {
    width: 100%; font-family: inherit; font-size: calc(16px * var(--fs)); line-height: 1.65;
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; resize: vertical; color: var(--text);
    min-height: 90px;
  }
  textarea:focus { outline: 2px solid var(--cyan); outline-offset: -1px; border-color: transparent; }
  textarea.big { min-height: 260px; }
  .step-nav { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-top: 1px solid var(--border); background: #fbfdfe; }
  .btn { height: 40px; padding: 0 18px; border-radius: 10px; font-size: calc(14px * var(--fs)); font-weight: 500; border: 1px solid var(--border); background: var(--surface); color: var(--navy); }
  .btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .wc { font-size: calc(13px * var(--fs)); color: var(--muted); }

  /* ---------- Question set (ECR + Q): runs before the writing steps, no Writing Support panel ---------- */
  body.in-q .workspace { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr); }
  body.in-q .luna, body.in-q .prompt-card, body.in-q .stepper { display: none; }
  .qs-head { border: 1px solid var(--border); border-top: 4px solid var(--qs-c); border-radius: 12px; padding: 12px 12px 4px; margin: 0 0 18px; text-align: center; background: var(--surface); }
  .qs-rc { --qs-c: #1fb3de; --qs-soft: #d9f2fb; }
  .qs-peer { --qs-c: #7a5cd6; --qs-soft: #e4dcfb; }
  .qs-sections { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .qs-sec { padding: 8px 12px 4px; border-radius: 10px; opacity: .55; }
  .qs-sec.on { opacity: 1; background: color-mix(in srgb, var(--qs-soft) 45%, transparent); }
  .qs-sec-name { display: block; font-weight: 700; font-size: calc(13.5px * var(--fs)); color: var(--qs-c); margin-bottom: 8px; }
  .qs-sec + .qs-sec { border-left: 1px solid var(--border); border-radius: 0 10px 10px 0; }
  .qs-head .qs-count { margin-bottom: 8px; font-weight: 600; color: var(--qs-c); }
  .qs-steps { display: flex; flex-wrap: wrap; row-gap: 8px; align-items: center; justify-content: center; margin: 0 0 6px; }
  .qs-steps button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--border); background: var(--surface); color: var(--muted); font-weight: 700; font-size: calc(13px * var(--fs)); padding: 0; }
  .qs-steps button.done { border-color: var(--qs-c, var(--navy-2)); background: var(--qs-c, var(--navy-2)); color: #fff; }
  .qs-steps button.active { border-color: var(--qs-c, var(--cyan)); color: var(--navy); box-shadow: 0 0 0 3px var(--qs-soft, var(--cyan-soft)); }
  .qs-steps button.done.active { color: #fff; }
  .qs-steps i { width: clamp(10px, 3vw, 28px); height: 2px; background: var(--border); }
  .qs-count { text-align: center; font-size: calc(12.5px * var(--fs)); color: var(--muted); margin: 0 0 18px; }
  .qs-kind { font-size: calc(11px * var(--fs)); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--cyan); margin: 0 0 6px; }
  .qs-intro { margin: 0 0 12px; }
  .qs-q { font-weight: 600; color: var(--navy); margin: 0 0 14px; }
  .qs-task { background: var(--qs-soft-peer, #e4dcfb); border-radius: 6px; padding: 8px 12px; font-weight: 600; color: #2a2150; margin: 0 0 14px; }
  .qs-para { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; line-height: 1.8; }
  .qs-blank { display: inline-block; min-width: 150px; border-bottom: 2px solid var(--muted); margin: 0 4px; padding: 0 4px; color: var(--muted); }
  .qs-blank.filled { border-bottom-color: var(--cyan); background: var(--cyan-softer); color: var(--navy); cursor: pointer; border-radius: 4px 4px 0 0; }
  .qs-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 14px; }
  .qs-opts.one-col { grid-template-columns: 1fr; }
  .qs-opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--surface); font-size: calc(14.5px * var(--fs)); line-height: 1.45; color: var(--text); }
  .qs-opt:hover { border-color: var(--cyan); }
  .qs-opt.on { border-color: var(--navy-2); background: var(--cyan-softer); }
  .qs-opt.right { border-color: #38a861; background: #f2faf5; }
  .qs-opt.wrong { border-color: #ef5a45; background: #fff6f4; }
  .qs-opt:disabled { cursor: default; }
  .qs-box { width: 18px; height: 18px; flex: none; margin-top: 2px; border: 2px solid #b7c3cc; border-radius: 4px; display: grid; place-items: center; color: transparent; font-size: 12px; font-weight: 800; }
  .qs-opts.single .qs-box { border-radius: 50%; }
  .qs-opt.on .qs-box { background: var(--navy-2); border-color: var(--navy-2); color: #fff; }
  .qs-fb { border-radius: 10px; padding: 10px 14px; margin: 0 0 8px; font-size: calc(14px * var(--fs)); }
  .qs-fb.right { background: #eaf6ef; color: #256b41; }
  .qs-fb.wrong { background: #fdeeec; color: #a8352a; }
  @media (max-width: 760px) { .qs-opts { grid-template-columns: 1fr; } }

  .sp-sub { margin: 8px 0 2px; }
  .sp-ex { margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--cyan-softer); font-size: calc(13.5px * var(--fs)); }
  .sp-ex span { font-weight: 700; color: var(--navy); }
  .ai-tag { display: block; font-size: calc(11px * var(--fs)); font-weight: 700; color: #7a5cd6; margin-bottom: 4px; }
  .org-starter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: #f3effd; color: #4a3a8a; font-size: calc(13.5px * var(--fs)); }
  .org-starter button { margin-left: auto; height: 26px; padding: 0 10px; border-radius: 6px; border: 1px solid #b9a8ee; background: #fff; color: #5a44b8; font-size: calc(12.5px * var(--fs)); font-weight: 700; }

  /* Step 4: View Passage / View Checklist tabs */
  .left-tabs { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px 0; }
  .left-tabs[hidden] { display: none; }
  .passage-bar[hidden] { display: none; }
  .left-tabs button { height: 44px; border-radius: 10px 10px 0 0; border: 0; font-family: inherit; font-size: calc(15px * var(--fs)); font-weight: 700; letter-spacing: .02em; text-transform: uppercase; cursor: pointer; background: #e7eef2; color: var(--navy); }
  .left-tabs button.on[data-left="passage"] { background: var(--navy); color: #fff; }
  .left-tabs button.on[data-left="checklist"] { background: #ec7a2d; color: #fff; }
  .left-tabs button:not(.on):hover { background: #dbe6ec; }
  /* Step 1 THINK note, claim box, and the claim pinned on Steps 2–4 */
  .think-box { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; margin: 0 0 14px; border-radius: 10px; background: var(--cyan-softer); border: 1px solid var(--cyan-soft); }
  .think-box span { flex: none; font-size: calc(11px * var(--fs)); font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #fff; background: var(--navy); border-radius: 6px; padding: 3px 8px; margin-top: 2px; }
  .think-box p { margin: 0; color: var(--navy); }
  .claim-box { margin: 0 0 14px; }
  .claim-q { margin: 0 0 10px; padding: 10px 12px; border-left: 4px solid var(--cyan); border-radius: 0 8px 8px 0; background: var(--cyan-softer); }
  .claim-q span { display: block; font-size: calc(10.5px * var(--fs)); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy-2); margin-bottom: 2px; }
  .claim-q p { margin: 0; font-weight: 600; color: var(--navy); }
  .claim-q small { display: block; margin-top: 4px; color: var(--muted); font-size: calc(12.5px * var(--fs)); }

  .claim-box textarea { min-height: 64px; }
  .claim-pin { display: flex; gap: 10px; align-items: center; padding: 10px 12px; margin: 0 0 14px; border-radius: 10px; background: #eaf8ee; border: 1px solid #bfe3cb; position: sticky; top: 0; z-index: 2; }
  .claim-pin span { flex: none; font-size: calc(11px * var(--fs)); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #256b41; }
  .claim-pin p { margin: 0; flex: 1; font-weight: 600; color: var(--text); }
  .claim-pin button { flex: none; height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid #9fd3b1; background: #fff; color: #256b41; font-weight: 700; font-size: calc(12.5px * var(--fs)); }
  .claim-pin.empty { background: #fff8e6; border-color: #f0dcb8; }
  .claim-pin.empty span, .claim-pin.empty button { color: #8a6a1c; }
  .claim-pin.empty p { font-weight: 400; color: var(--muted); }
  /* My claim, in the middle panel header on Steps 2–4 (one line; click to see it all) */
  .claim-strip { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 auto; padding: 4px 6px 4px 10px; border-radius: 8px; background: #eaf8ee; border: 1px solid #bfe3cb; }
  .claim-strip[hidden] { display: none; }
  #stepCount { white-space: nowrap; flex: none; }
  .claim-strip + .spacer { flex: 0 0 8px; }
  .cs-label { flex: none; font-size: calc(10.5px * var(--fs)); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #256b41; }
  .cs-text { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; font: inherit; font-size: calc(13.5px * var(--fs)); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .claim-strip.open .cs-text { white-space: normal; }
  .cs-edit { flex: none; height: 24px; padding: 0 9px; border-radius: 6px; border: 1px solid #9fd3b1; background: #fff; color: #256b41; font-weight: 700; font-size: calc(12px * var(--fs)); cursor: pointer; }
  .claim-strip.empty { background: #fff8e6; border-color: #f0dcb8; }
  .claim-strip.empty .cs-label, .claim-strip.empty .cs-edit { color: #8a6a1c; }
  .claim-strip.empty .cs-text { font-weight: 400; color: var(--muted); cursor: default; }
  /* Word tools */
  .wt-ask { margin: 0 0 6px; font-weight: 700; color: var(--navy); }
  .wt-purposes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .wt-purpose { border: 1px solid var(--border); background: var(--surface); color: var(--navy); border-radius: 999px; padding: 5px 10px; font: inherit; font-size: calc(13px * var(--fs)); font-weight: 600; cursor: pointer; }
  .wt-purpose.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .wt-pick { padding: 8px 10px; border-radius: 8px; background: var(--cyan-softer); margin-bottom: 6px; }
  .wchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 6px; }
  .wchip { border: 1.5px solid #9fd3b1; background: #fff; color: #1f5f3a; border-radius: 8px; padding: 4px 10px; font: inherit; font-size: calc(13.5px * var(--fs)); font-weight: 700; cursor: pointer; }
  .wchip:hover { background: #eaf8ee; }
  .wchip.plain { border-color: var(--border); color: var(--navy); font-weight: 600; }
  .wt-ex { margin: 4px 0 0; font-size: calc(13px * var(--fs)); } .wt-ex span { font-weight: 700; color: var(--muted); }
  .wt-note { margin: 4px 0 0; font-size: calc(12.5px * var(--fs)); color: var(--muted); font-style: italic; }
  .wt-sub { margin: 6px 0 2px; font-size: calc(13px * var(--fs)); }
  .wt-swap { display: flex; gap: 6px; margin-bottom: 4px; }
  .wt-swap input { flex: 1; min-width: 0; height: 32px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; font: inherit; font-size: calc(13.5px * var(--fs)); }
  .wt-swap button { height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--navy); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .wt-tip { margin: 6px 0 0; font-size: calc(12px * var(--fs)); color: var(--muted); }
  .wt-tip.warn { color: #a8352a; font-weight: 600; }
  /* Highlighting */
  mark.hl { color: inherit; border-radius: 3px; padding: 1px 0; cursor: pointer; }
  .hl-green { background: #bff0c9; }
  .hl-blue  { background: #cfe0ff; }
  .hl-red   { background: #ffcfcf; }
  .hl-pop {
    position: fixed; z-index: 50; display: none; gap: 4px; padding: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(13,66,87,.18);
  }
  .hl-pop.show { display: flex; }
  .hl-pop button { display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--text); white-space: nowrap; }
  .hl-pop button:hover { background: var(--cyan-softer); }
  .hl-pop .sw { width: 16px; height: 16px; border-radius: 50%; flex: none; }
  .hl-pop .rm { color: #b3261e; border-left: 1px solid var(--border); border-radius: 0 8px 8px 0; }
  .hl-legend { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 10px; }
  .hl-legend li { display: flex; gap: 12px; align-items: center; background: var(--sand); border: 1px solid var(--sand-border); border-radius: 10px; padding: 12px 14px; }
  .hl-legend .sw { width: 34px; height: 34px; border-radius: 8px; flex: none; }
  .hl-legend b { display: block; font-weight: 600; color: var(--navy); }
  .hl-legend small { color: var(--muted); font-size: calc(13px * var(--fs)); line-height: 1.4; display: block; }
  .hl-legend .count { margin-left: auto; flex: none; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px; background: #fff; border: 1px solid var(--sand-border); display: grid; place-items: center; font-size: calc(13px * var(--fs)); font-weight: 600; color: var(--navy); }
  .hl-tip { font-size: calc(13px * var(--fs)); color: var(--muted); margin: 0; }
  .char-count { text-align: right; font-size: calc(13px * var(--fs)); color: var(--muted); margin: -10px 0 16px; }
  .char-count.over { color: #b3261e; font-weight: 600; }

  /* Graphic organizer (Step 3): the color lives on each section's keyword */
  .org { display: grid; gap: 16px; margin-bottom: 8px; }
  .org-sec { border: 1px solid #cfe3ec; border-radius: 8px; overflow: hidden; background: var(--surface); }
  .org-head { background: #e9f6fc; padding: 12px 16px; font-size: calc(14.5px * var(--fs)); font-weight: 600; color: #2a3f4d; line-height: 1.45; }
  .org-head .kw { font-weight: 700; }
  .kw-green  { color: #2e8b3a; }
  .kw-purple { color: #a23be6; }
  .kw-blue   { color: #2a66c9; }
  .kw-red    { color: #e0605a; }
  .kw-orange { color: #ef9a2e; }
  .rte-bar { display: flex; gap: 2px; padding: 4px 8px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .rte-bar button { width: 30px; height: 28px; border: 0; background: none; border-radius: 6px; color: var(--text); display: grid; place-items: center; font-size: 14px; }
  .rte-bar button:hover { background: var(--cyan-softer); }
  .rte-bar .sep { width: 1px; background: var(--border); margin: 4px 6px; }
  .rte { min-height: 96px; padding: 10px 14px; font-size: calc(15px * var(--fs)); line-height: 1.6; outline: none; }
  .rte:focus { box-shadow: inset 0 0 0 2px var(--cyan); }
  .rte:empty::before { content: attr(data-placeholder); color: #98a6ae; font-style: italic; }
  .rte ul, .rte ol { margin: 4px 0; padding-left: 22px; }

  /* Step 4: essay box + Revise / Edit checklist (left panel) */
  .essay-note { background: var(--sand); border: 1px solid var(--sand-border); border-radius: 10px; padding: 12px 16px; color: #6b5a3e; margin: 0 0 16px; }
  .rte-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .rte-wrap .rte-bar { border-top: 0; }
  .rte.big { min-height: 280px; }
  .rte p { margin: 0 0 .8em; }
  .rebuild { background: none; border: 0; padding: 0; color: var(--navy-2); font-size: calc(13px * var(--fs)); text-decoration: underline; text-underline-offset: 2px; }
  .revise { --rv: #4a7fe0; --rv-bg: #e6effc; }
  .revise[data-tab="edit"] { --rv: #3d9a5c; --rv-bg: #e5f4ea; }
  .rv-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .rv-top .luna-avatar { width: 52px; height: 52px; }
  .rv-top .bubble { font-size: calc(16px * var(--fs)); padding: 10px 16px; }
  body[data-band="9-12"] .rv-top { display: none; }
  .rv-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .rv-tab { display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 14px; border: 2px solid transparent; font-size: calc(18px * var(--fs)); font-weight: 600; }
  .rv-tab[data-key="revise"] { background: #e6effc; color: #3b78e0; }
  .rv-tab[data-key="edit"]   { background: #e5f4ea; color: #3d9a5c; }
  .rv-tab.on { border-color: currentColor; }
  .rv-tab .ck { color: #9aa7b3; }
  .rv-tab.on .ck, .rv-tab.done .ck { color: currentColor; }
  .rv-q { font-size: calc(19px * var(--fs)); font-weight: 600; color: var(--text); margin: 0 0 14px; }
  .rv-items { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 12px; }
  .rv-item { display: flex; align-items: center; gap: 16px; padding: 12px; border-radius: 14px; background: #f6f8fa; border: 1px solid #e3e8ee; cursor: pointer; }
  .rv-item.on { background: var(--rv-bg); border-color: var(--rv); }
  .rv-letter { width: 52px; height: 52px; flex: none; border-radius: 12px; background: var(--rv); color: #fff; display: grid; place-items: center; font-size: calc(26px * var(--fs)); font-weight: 700; }
  .rv-text { flex: 1; font-weight: 600; font-size: calc(16px * var(--fs)); line-height: 1.35; }
  .rv-box { width: 44px; height: 44px; flex: none; border-radius: 10px; border: 2.5px solid #c5ced8; background: #fff; display: grid; place-items: center; color: transparent; }
  .rv-item.on .rv-box { background: var(--rv); border-color: var(--rv); color: #fff; }
  .rv-stars { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-weight: 700; font-size: calc(18px * var(--fs)); color: var(--navy); }
  .rv-stars svg { width: 30px; height: 30px; fill: #dde3e9; transition: fill .2s; }
  .rv-stars svg.lit { fill: #f5b400; }
  .rv-next { width: 100%; height: 52px; border-radius: 12px; border: 0; background: var(--rv); color: #fff; font-size: calc(18px * var(--fs)); font-weight: 600; }
  .rv-next:hover { filter: brightness(.95); }
  /* 4–5 list layout */
  .rvl-head, .rvc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .rvl-head h4, .rvc-head h4 { margin: 0; font-size: calc(20px * var(--fs)); font-weight: 600; color: var(--navy); line-height: 1.3; }
  .rvl-head span, .rvc-head span { color: var(--muted); font-weight: 600; font-size: calc(14px * var(--fs)); white-space: nowrap; }
  .rvl-bar { height: 10px; border-radius: 999px; background: #e3e8ee; overflow: hidden; margin-bottom: 16px; }
  .rvl-bar i { display: block; height: 100%; background: #4a7fe0; transition: width .25s; }
  .rvl-tabs, .rvc-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .rvl-tab { display: flex; justify-content: space-between; align-items: center; height: 52px; padding: 0 18px; border-radius: 12px; border: 0; font-size: calc(17px * var(--fs)); font-weight: 700; }
  .rvl-tab[data-key="revise"] { background: #e6effc; color: #3b78e0; }
  .rvl-tab[data-key="edit"]   { background: #e5f4ea; color: #3d9a5c; }
  .rvl-tab.on[data-key="revise"] { background: #4a7fe0; color: #fff; }
  .rvl-tab.on[data-key="edit"]   { background: #3d9a5c; color: #fff; }
  .rvl-box { border: 1px solid #dfe6ee; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .rvl-box-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: var(--rv-bg); }
  .rvl-box-head b { color: var(--rv); font-size: calc(17px * var(--fs)); }
  .rvl-box-head small { color: var(--muted); font-weight: 600; font-size: calc(13px * var(--fs)); }
  .rvl-box-head .n { color: var(--muted); font-weight: 600; font-size: calc(14px * var(--fs)); }
  .rvl-row { display: flex; gap: 16px; align-items: flex-start; padding: 12px 18px; border-top: 1px solid #eef1f4; cursor: pointer; font-weight: 600; font-size: calc(15.5px * var(--fs)); line-height: 1.45; }
  .rvl-row:hover { background: #fafbfc; }
  .rvl-row .rv-box { width: 28px; height: 28px; border-radius: 7px; border-width: 2px; }
  .rvl-row.on .rv-box { background: var(--rv); border-color: var(--rv); color: #fff; }
  .rvl-row .rv-box svg { width: 16px; height: 16px; }
  .rvl-next { width: 100%; height: 52px; border-radius: 12px; border: 0; background: #52a06a; color: #fff; font-size: calc(18px * var(--fs)); font-weight: 700; }

  /* 6–8 compact layout */
  .rvc-head { padding-bottom: 12px; border-bottom: 1px solid #e3e8ee; }
  .rvc-head span { font-weight: 400; }
  .rvc-tabs .rvl-tab { height: 46px; font-size: calc(15px * var(--fs)); }
  .rvc-eyebrow { font-size: calc(12.5px * var(--fs)); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6b7c8a; padding-bottom: 8px; border-bottom: 1px solid #e3e8ee; margin: 0; }
  .rvc-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid #e3e8ee; font-weight: 600; font-size: calc(15.5px * var(--fs)); line-height: 1.4; }
  .rvc-done { flex: none; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid #d5dde5; background: #fff; color: #6b7c8a; font-weight: 600; font-size: calc(14px * var(--fs)); }
  .rvc-done.on { background: var(--rv); border-color: var(--rv); color: #fff; }
  .rvc-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; color: var(--muted); font-size: calc(13.5px * var(--fs)); }
  .rvc-foot .view-psg { margin: 0; background: #fff; border-color: #d5dde5; font-weight: 600; }

  .view-psg { margin-top: 18px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1.5px solid var(--navy); background: var(--cyan-softer); color: var(--navy); font-size: calc(14px * var(--fs)); }
  .back-rv { margin: 0 0 14px; }

  /* Luna — matches the current Writing Support box; Luna sits beside her bubble */
  .luna .panel-head { justify-content: center; border-bottom: 0; padding: 20px 20px 8px; position: relative; }
  .luna .panel-head h2 { font-size: calc(20px * var(--fs)); font-weight: 500; color: #2f3a40; }
  .luna .panel-body { padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
  .luna-intro { display: flex; gap: 12px; align-items: center; }
  .luna-avatar { width: 72px; height: 72px; flex: none; border-radius: 50%; background: #0f2540; display: grid; place-items: center; overflow: hidden; }
  .luna-avatar img { width: 80%; height: 80%; object-fit: contain; }
  .bubble { position: relative; background: #d6f3fb; border-radius: 14px; padding: 14px 16px; font-size: calc(16px * var(--fs)); font-weight: 500; line-height: 1.45; color: #111; }
  .bubble::before { content: ""; position: absolute; left: -9px; top: 50%; transform: translateY(-50%); border: 9px solid transparent; border-left: 0; border-right-color: #d6f3fb; }
  .pick { text-align: center; color: #555; font-size: calc(15px * var(--fs)); margin: 4px 0 0; }
  /* Support cards: compact, and each one expands in place (accordion) */
  .supports { display: grid; gap: 8px; }
  .support-item { border-radius: 12px; background: #e6f7fc; color: #1d5a5a; overflow: hidden; }
  .support-item.blue { background: #dfe8f9; color: #2350a8; }
  .support-item.open { box-shadow: inset 0 0 0 1.5px currentColor; }
  .support {
    width: 100%; display: flex; gap: 10px; align-items: center; text-align: left;
    padding: 8px 12px; border: 0; background: none; color: inherit;
    font-size: calc(14.5px * var(--fs)); font-weight: 600; line-height: 1.3;
  }
  .support:hover { background: rgba(255,255,255,.35); }
  .support .ic { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.75); display: grid; place-items: center; flex: none; }
  .support .ic svg { width: 17px; height: 17px; }
  .support .chev { margin-left: auto; flex: none; opacity: .6; transition: transform .2s; }
  .support-item.open .chev { transform: rotate(180deg); }
  .support-body { margin: 0 8px 8px; padding: 10px 12px; border-radius: 8px; background: var(--surface); color: var(--text); font-size: calc(14px * var(--fs)); line-height: 1.5; }
  .support-body ul { margin: 6px 0 0; padding-left: 18px; }
  /* Older grades: tighter still */
  body[data-band="6-8"] .support, body[data-band="9-12"] .support { padding: 6px 10px; gap: 8px; }
  body[data-band="6-8"] .support .ic, body[data-band="9-12"] .support .ic { width: 24px; height: 24px; }
  body[data-band="6-8"] .support .ic svg, body[data-band="9-12"] .support .ic svg { width: 14px; height: 14px; }
  body[data-band="6-8"] .supports, body[data-band="9-12"] .supports { gap: 6px; }
  .wb { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: calc(13px * var(--fs)); }
  .wb th, .wb td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; line-height: 1.4; }
  .wb th { width: 38%; background: var(--cyan-softer); font-weight: 600; color: var(--navy); }
  .icon-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); display: grid; place-items: center; position: absolute; right: 14px; top: 18px; }
  .icon-btn:hover { background: var(--cyan-softer); }
  body.luna-collapsed .luna .panel-body, body.luna-collapsed .luna h2 { display: none; }
  body.luna-collapsed .luna .panel-head { flex-direction: column; border: 0; padding: 14px 0; }
  body.luna-collapsed .luna .icon-btn { position: static; }
  .luna-mini { display: none; }
  /* Grades 9–12: no Luna character, just the Writing Support list */
  body[data-band="9-12"] .luna-intro, body[data-band="9-12"] .luna-mini { display: none !important; }
  body[data-band="9-12"] .pick { text-align: left; }
  body.luna-collapsed .luna-mini { display: grid; margin-top: 8px; width: 48px; height: 48px; }

  /* Responsive */
  @media (max-width: 1180px) {
    .workspace { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .luna { grid-column: 1 / -1; }
    .workspace > .panel.luna { position: static; max-height: none; }
  }
  @media (max-width: 760px) {
    .workspace { grid-template-columns: 1fr; padding: 12px 16px; }
    .workspace > .panel { position: static !important; max-height: none !important; }
    .who .sub, .cc-btn .split, .cc-btn span:last-child, .save-btn .lbl { display: none; }
  }

  /* ---------- Extended Writing Feedback (after Submit) ---------- */
  .fb-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(1,23,45,.55); display: none; align-items: center; justify-content: center; padding: 24px; }
  .fb-overlay.show { display: flex; }
  .fb { width: min(1100px, 100%); max-height: calc(100vh - 48px); background: #f7fafc; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .fb-top { flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 22px; color: #fff;
    background: linear-gradient(100deg, #02384d 0%, #035c78 55%, #0a7ea4 100%); border-bottom: 3px solid #1fb3de; }
  .fb-top h2 { margin: 0; font-size: 22px; font-weight: 800; flex: 1; }
  .fb-star { width: 30px; height: 30px; border-radius: 50%; background: #1fb3de; display: grid; place-items: center; }
  .fb-x { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.4); background: rgba(255,255,255,.1); color: #fff; font-size: 18px; }
  .fb-scroll { flex: 1; overflow-y: auto; padding: 20px 26px 8px; }
  .fb-hero { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: center; margin-bottom: 18px; }
  .fb-score { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .fb-ring { width: 128px; height: 128px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 10px #eaf4f9, 0 8px 20px rgba(2,56,77,.12); display: grid; place-items: center; font-weight: 800; color: #14344a; }
  .fb-ring b { font-size: 50px; } .fb-ring small { font-size: 24px; color: #5c7285; }
  .fb-view { height: 44px; padding: 0 20px; border-radius: 10px; border: 2px solid #02384d; background: #fff; color: #02384d; font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .fb-prompt { text-align: center; font-weight: 700; font-size: 17px; color: #14344a; margin: 0 0 12px; line-height: 1.45; }
  .fb-status { display: flex; justify-content: center; margin-bottom: 14px; }
  .fb-status span { display: inline-flex; align-items: center; gap: 8px; padding: 7px 18px; border-radius: 999px; font-weight: 700; font-size: 16px; }
  .fb-status .not { background: #fdecea; color: #c23b2e; border: 1px solid #f6c9c3; }
  .fb-status .app { background: #fff4e0; color: #b86e00; border: 1px solid #f5d9a6; }
  .fb-status .met { background: #e5f4ea; color: #2e7d4a; border: 1px solid #bfe3cb; }
  .fb-scale { display: flex; justify-content: center; align-items: center; }
  .fb-scale .lv { width: 64px; height: 50px; border-radius: 10px; background: #fff; border: 1px solid #dde8ee; display: grid; place-items: center; font-size: 24px; font-weight: 800; color: #8ea1ae; }
  .fb-scale .lv.on { background: #02384d; border-color: #02384d; color: #fff; }
  .fb-scale .ln { width: 40px; height: 2px; background: #dde8ee; }
  .fb-scale-labels { display: flex; justify-content: center; gap: 250px; margin-top: 6px; font-size: 13px; font-weight: 600; color: #5c7285; }
  .fb-answer { background: #fff; border: 1px solid #dde8ee; border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; line-height: 1.6; color: #14344a; }
  .fb-sec { background: #fff; border-radius: 16px; overflow: hidden; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(2,56,77,.08); }
  .fb-sec-head { display: flex; align-items: center; gap: 14px; padding: 10px 14px 10px 16px; color: #fff; background: linear-gradient(100deg, #02384d, #035c78 70%, #0a6f93); }
  .fb-sec-head h3 { margin: 0; flex: 1; font-size: 18px; font-weight: 800; }
  .fb-bulb { width: 34px; height: 34px; border-radius: 50%; background: #1fb3de; display: grid; place-items: center; flex: none; }
  .fb-sec-head .n { font-weight: 800; font-size: 17px; }
  .fb-bar { width: 200px; height: 8px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
  .fb-bar i { display: block; height: 100%; background: #1fb3de; }
  .fb-pill { background: #fff; color: #14344a; border-radius: 999px; padding: 6px 20px; font-weight: 800; font-size: 18px; }
  .fb-crits { display: grid; gap: 12px; padding: 14px 16px 6px; }
  .fb-crit { border: 1px solid #e3eaef; border-radius: 12px; background: #fff; padding: 10px 8px 12px; text-align: center; font-weight: 700; font-size: 14px; color: #14344a; cursor: pointer; }
  .fb-crit.on[data-st="not"] { border-color: #f09a8f; background: #fff7f5; }
  .fb-crit.on[data-st="almost"] { border-color: #f5c46a; background: #fffaf0; }
  .fb-crit.on[data-st="got"] { border-color: #8fd1a6; background: #f4fbf6; }
  .fb-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 4px 12px; border-radius: 999px; color: #fff; font-size: 13.5px; font-weight: 700; }
  .fb-chip[data-st="not"] { background: #ef5a45; } .fb-chip[data-st="almost"] { background: #f0a020; } .fb-chip[data-st="got"] { background: #38a861; }
  .fb-chip i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; }
  .fb-detail { display: flex; align-items: center; gap: 16px; margin: 6px 16px 16px; padding: 12px 16px; border-radius: 12px; border: 1px solid; }
  .fb-detail[data-st="not"] { border-color: #f6c9c3; background: #fff8f6; }
  .fb-detail[data-st="almost"] { border-color: #f5d9a6; background: #fffbf2; }
  .fb-detail[data-st="got"] { border-color: #bfe3cb; background: #f5fbf7; }
  .fb-detail .ic { width: 44px; height: 44px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 22px; flex: none; }
  .fb-detail[data-st="not"] .ic { background: #ef5a45; } .fb-detail[data-st="almost"] .ic { background: #f0a020; } .fb-detail[data-st="got"] .ic { background: #38a861; }
  .fb-detail h4 { margin: 0; font-size: 19px; color: #14344a; }
  .fb-detail p { margin: 2px 0 0; font-size: 15.5px; }
  .fb-detail[data-st="not"] p { color: #c23b2e; } .fb-detail[data-st="almost"] p { color: #9a5b00; } .fb-detail[data-st="got"] p { color: #2e7d4a; }
  .fb-say { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #e9f2f7; color: #035c78; display: grid; place-items: center; flex: none; }
  .fb-foot { flex: none; display: flex; align-items: center; gap: 22px; padding: 12px 26px; background: #fff; border-top: 1px solid #e3eaef; font-weight: 600; color: #14344a; }
  .fb-foot .dot { display: inline-block; width: 16px; height: 16px; border-radius: 50%; vertical-align: -3px; margin-right: 6px; }
  .fb-done { margin-left: auto; height: 50px; padding: 0 34px; border-radius: 12px; border: 0; color: #fff; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 12px; background: linear-gradient(100deg, #0a7ea4, #035c78); }
  .fb-demo { font-size: 12px; font-weight: 600; color: #5c7285; display: flex; gap: 6px; align-items: center; }
  .fb-demo button { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid #dde8ee; background: #fff; font-size: 12px; font-weight: 700; color: #14344a; }
  .fb-demo button.on { background: #02384d; border-color: #02384d; color: #fff; }
  @media (max-width: 860px) { .fb-hero { grid-template-columns: 1fr; } .fb-crits { grid-template-columns: 1fr 1fr !important; } .fb-scale-labels { gap: 80px; } .fb-bar { display: none; } }

/* ---------- Revision & Editing Tips panel: verbatim from CMS handoff/revision-editing-panel/revisioneditingpanel.css ---------- */
/* Revision and Editing Tips panel — append to public/static/css/student.css.
   One root class (.ret) and three band variants. Colors are fixed to the LoneStar CR light surface. */
/* .ret-root is the size container: the @container rules below read its width, so the panel fills whatever column it is given. */
.ret-root{container-type:inline-size;min-width:0}
.ret{color:#15202b;display:grid;gap:12px;min-width:0}
.ret button{font:inherit;cursor:pointer}
.ret button:focus-visible{outline:3px solid #1fb6d5;outline-offset:2px}
.ret .ret-empty{font-size:13px;color:#5b6b7b;margin:0}
.ret .ret-cnt{font-size:12px;color:#5b6b7b;font-weight:700}
/* Revise / Edit stage strip shared by grades 4–8: blue is revising, green is editing. The selected
   tab fills with its colour so the student always knows which stage they are in. */
.ret-guided .ret-stage,.ret-writer .ret-stage{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ret-guided .ret-stage button,.ret-writer .ret-stage button{border:2px solid transparent;border-radius:10px;padding:8px 10px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ret-guided .ret-stage button>span:first-child,.ret-writer .ret-stage button>span:first-child{display:inline-flex;align-items:center;gap:6px}
.ret-guided .ret-stage button{font-size:15px;min-height:44px}
.ret-writer .ret-stage button{font-size:13px;min-height:38px}
.ret-guided .ret-stage-rev,.ret-writer .ret-stage-rev{background:#e3eefc;color:#2f80ed}
.ret-guided .ret-stage-ed,.ret-writer .ret-stage-ed{background:#e2f5ea;color:#2f9e63}
.ret-guided .ret-stage-rev[aria-selected="true"],.ret-writer .ret-stage-rev[aria-selected="true"]{border-color:#2f80ed;background:#2f80ed;color:#fff}
.ret-guided .ret-stage-ed[aria-selected="true"],.ret-writer .ret-stage-ed[aria-selected="true"]{border-color:#2f9e63;background:#2f9e63;color:#fff}
.ret-guided .ret-stage button[aria-selected="true"] svg path,.ret-writer .ret-stage button[aria-selected="true"] svg path{stroke:#fff}

/* ---- Luna · grades 2–3 ---- */
.ret-luna{font-size:18px;line-height:1.35;gap:14px}
.ret-luna .ret-greet{display:flex;gap:10px;align-items:center}
.ret-luna .ret-luna-star{width:44px;height:44px;border-radius:50%;background:#02384d;display:grid;place-items:center;flex:none}
.ret-luna .ret-say{background:#dff2f8;border-radius:14px;padding:8px 12px;font-weight:700;color:#02384d;font-size:17px}
.ret-luna .ret-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ret-luna .ret-steps button{border:3px solid transparent;border-radius:14px;padding:10px;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px}
.ret-luna .ret-step-rev{background:#e3eefc;color:#2f80ed}
.ret-luna .ret-step-ed{background:#e2f5ea;color:#2f9e63}
.ret-luna .ret-step-rev[aria-selected="true"]{border-color:#2f80ed}
.ret-luna .ret-step-ed[aria-selected="true"]{border-color:#2f9e63}
.ret-luna .ret-ask{font-weight:800;font-size:19px;margin:0}
.ret-luna .ret-cards{display:grid;gap:10px}
.ret-luna .ret-tip{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:10px;align-items:center;border-radius:16px;padding:10px;background:#f6f9fb;border:2px solid #e3eaf0}
.ret-luna .ret-tip.ret-done{background:#e2f5ea;border-color:#2f9e63}
.ret-luna .ret-letter{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:26px;color:#fff;background:#2f80ed}
.ret-luna.ret-step-edit .ret-letter{background:#2f9e63}
.ret-luna .ret-tip.ret-nobadge{grid-template-columns:minmax(0,1fr) 52px}
.ret-luna .ret-txt{display:grid;gap:2px;min-width:0}
.ret-luna .ret-txt b{font-size:18px;line-height:1.25}
.ret-luna .ret-txt span{font-size:15px;color:#5b6b7b}
.ret-luna .ret-listen{border:0;background:none;padding:0;color:#0a7c94;font-size:14px;font-weight:700;display:inline-flex;gap:4px;align-items:center;justify-self:start}
.ret-luna .ret-check{width:52px;height:52px;border-radius:14px;border:3px solid #b9c6d1;background:#fff;display:grid;place-items:center;padding:0}
.ret-luna .ret-tip.ret-done .ret-check{background:#2f9e63;border-color:#2f9e63}
.ret-luna .ret-stars{display:flex;gap:6px;align-items:center;font-weight:800;color:#02384d}
.ret-luna .ret-stars svg{width:30px;height:30px}
.ret-luna .ret-next{background:#02384d;color:#fff;border:0;border-radius:14px;padding:12px 16px;font-weight:800;font-size:18px;min-height:52px}
.ret-luna .ret-next-rev{background:#2f80ed}
.ret-luna .ret-next-ed{background:#2f9e63}
.ret-luna .ret-cheer{background:#e2f5ea;border-radius:14px;padding:10px 12px;font-weight:800;color:#1f6b45}
.ret-luna .ret-view{justify-self:start;background:#eef7fb;border:1px solid #1fb6d5;color:#02384d;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:700}

/* ---- Guided · grades 4–5 ---- */
.ret-guided{font-size:15px}
.ret-guided .ret-hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ret-guided .ret-hd h4{margin:0;font-weight:800;font-size:17px;color:#02384d}
.ret-guided .ret-prog{height:8px;border-radius:999px;background:#e3eaf0;overflow:hidden}
.ret-guided .ret-prog i{display:block;height:100%;background:#0a7c94;border-radius:999px;transition:width .2s}
.ret-guided .ret-sec{border:1px solid #dfe6ec;border-radius:12px;overflow:hidden}
.ret-guided .ret-sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:#f6f9fb;font-weight:800;color:#02384d}
.ret-guided .ret-sec-rev .ret-sec-head{background:#e3eefc;color:#1f5fbf}
.ret-guided .ret-sec-ed .ret-sec-head{background:#e2f5ea;color:#1f6b45}
.ret-guided.ret-step-edit .ret-lt{background:#2f9e63}
.ret-guided .ret-advance{border:0;border-radius:10px;padding:12px 16px;font-weight:800;font-size:16px;color:#fff;background:#2f80ed;width:100%;min-height:48px}
.ret-guided .ret-advance-ed{background:#2f9e63}
.ret-guided .ret-advance-back{background:#fff;color:#2f80ed;border:2px solid #2f80ed;font-size:14px;min-height:40px;padding:8px 12px}
.ret-guided .ret-complete-note{margin:0;font-weight:800;color:#1f6b45;background:#e2f5ea;border-radius:10px;padding:10px 12px}
.ret-guided .ret-row{display:grid;grid-template-columns:34px 28px minmax(0,1fr);gap:8px;align-items:start;padding:8px 12px;border-top:1px solid #edf1f5}
.ret-guided .ret-row.ret-nobadge{grid-template-columns:34px minmax(0,1fr)}
.ret-guided .ret-cb{width:26px;height:26px;border-radius:7px;border:2px solid #9fb0bf;background:#fff;display:grid;place-items:center;margin-top:2px;padding:0}
.ret-guided .ret-row.ret-done .ret-cb{background:#2f9e63;border-color:#2f9e63}
.ret-guided .ret-lt{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:#2f80ed;margin-top:1px}
.ret-guided .ret-q{font-weight:700}
.ret-guided .ret-row.ret-done .ret-q{text-decoration:line-through;color:#6d7d8c}
.ret-guided .ret-try{font-size:13px;color:#5b6b7b;margin-top:2px}
.ret-guided .ret-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ret-guided .ret-link{border:1px solid #bfe6f0;background:#eef9fc;color:#02384d;border-radius:8px;padding:7px 12px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}

/* ---- Writer · grades 6–8 ---- */
.ret-writer{font-size:14px;color:#1c2b36}
.ret-writer .ret-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid #d9e1e8;padding-bottom:8px}
.ret-writer .ret-hd h4{margin:0;font-weight:700;font-size:16px;color:#02384d}
.ret-writer .ret-n{font-size:12px;color:#66788a;font-variant-numeric:tabular-nums}
.ret-writer .ret-k,.ret-guided .ret-k{font-weight:600;font-variant-numeric:tabular-nums}
.ret-writer .ret-sec h5{margin:0 0 4px;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#66788a}
.ret-writer .ret-item{border-top:1px solid #d9e1e8;padding:8px 0;display:grid;gap:4px}
.ret-writer .ret-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ret-writer .ret-move{font-weight:700}
.ret-writer .ret-item.ret-done .ret-move{color:#66788a;text-decoration:line-through}
.ret-writer .ret-what{color:#66788a;font-size:13px}
.ret-writer .ret-donebtn{flex:none;border:1px solid #d9e1e8;background:#fff;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:600;color:#66788a;display:inline-flex;align-items:center;gap:4px}
.ret-writer .ret-donebtn[aria-pressed="true"]{background:#e2f5ea;border-color:#2f9e63;color:#2f9e63}
.ret-writer .ret-how{font-size:12px;color:#66788a;background:#f6f9fb;border-radius:6px;padding:6px 8px;display:none}
.ret-writer .ret-item.ret-open .ret-how{display:block}
.ret-writer .ret-more{border:0;background:none;padding:0;color:#02384d;font-size:12px;font-weight:600;justify-self:start}
.ret-writer .ret-advance{border:0;background:#2f9e63;color:#fff;border-radius:6px;padding:8px 12px;font-weight:600;font-size:13px}
.ret-writer.ret-step-edit .ret-sec h5{color:#1f6b45}
.ret-writer .ret-complete-note{font-size:13px;color:#2f9e63;font-weight:600;border-top:1px solid #d9e1e8;padding-top:8px;margin:0}
.ret-writer .ret-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:#66788a}
.ret-writer .ret-btn{border:1px solid #d9e1e8;background:#fff;color:#02384d;border-radius:6px;padding:6px 10px;font-weight:600;font-size:13px}

/* ---- Fill the passage panel ----
   The panel this replaces is the full width of the passage column (about 1,300px on a laptop,
   24px body type). Sizes above are for a narrow column; these container queries (on .ret-root) scale type
   and lay lists out in two columns once the panel is wide, so the checklist fills the box
   instead of sitting small in a corner. */
@container (min-width: 640px) {
  .ret{gap:16px}
  .ret-luna{font-size:20px}
  .ret-luna .ret-say{font-size:20px;padding:10px 16px}
  .ret-luna .ret-steps button{font-size:21px;min-height:64px}
  .ret-luna .ret-ask{font-size:23px}
  .ret-luna .ret-cards{grid-template-columns:1fr 1fr;gap:12px}
  .ret-luna .ret-txt b{font-size:20px}
  .ret-luna .ret-txt span{font-size:16px}
  .ret-luna .ret-next{font-size:20px;min-height:58px}
  .ret-luna .ret-view{font-size:17px;padding:10px 18px}
  .ret-guided{font-size:18px}
  .ret-guided .ret-hd h4{font-size:22px}
  .ret-guided .ret-cnt,.ret .ret-cnt{font-size:14px}
  .ret-guided .ret-stage button{font-size:18px;min-height:52px}
  .ret-guided .ret-sec-head{font-size:19px;padding:12px 16px}
  .ret-guided .ret-sec-body{display:grid;grid-template-columns:1fr 1fr}
  .ret-guided .ret-row{grid-template-columns:38px 32px minmax(0,1fr);padding:12px 16px;border-top:0;border-bottom:1px solid #edf1f5}
  .ret-guided .ret-row.ret-nobadge{grid-template-columns:38px minmax(0,1fr)}
  .ret-guided .ret-cb{width:30px;height:30px}
  .ret-guided .ret-lt{width:32px;height:32px;font-size:17px}
  .ret-guided .ret-try{font-size:15px}
  .ret-guided .ret-advance{font-size:19px;min-height:56px}
  .ret-guided .ret-link{font-size:16px;padding:9px 14px}
  .ret-writer{font-size:17px}
  .ret-writer .ret-hd h4{font-size:21px}
  .ret-writer .ret-n{font-size:14px}
  .ret-writer .ret-stage button{font-size:16px;min-height:46px}
  .ret-writer .ret-sec h5{font-size:14px}
  .ret-writer .ret-items{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
  .ret-writer .ret-item{padding:12px 0}
  .ret-writer .ret-what,.ret-writer .ret-how{font-size:15px}
  .ret-writer .ret-donebtn{font-size:14px;padding:5px 14px}
  .ret-writer .ret-more{font-size:14px}
  .ret-writer .ret-advance{font-size:16px;padding:10px 16px}
  .ret-writer .ret-foot{font-size:14px}
  .ret-writer .ret-btn{font-size:15px;padding:8px 14px}
}
@container (min-width: 1000px) {
  .ret-luna{font-size:22px}
  .ret-luna .ret-txt b{font-size:22px}
  .ret-guided{font-size:20px}
  .ret-guided .ret-q{font-size:21px}
  .ret-writer{font-size:18px}
  .ret-writer .ret-move{font-size:19px}
}

/* ---- Final Check · optional third stage (a state's Writer's Checklist) ---- */
.ret-luna .ret-steps.ret-steps-3{grid-template-columns:1fr 1fr 1fr}
.ret-luna .ret-step-final{background:#efe7fb;color:#7c3aed}
.ret-luna .ret-step-final[aria-selected="true"]{border-color:#7c3aed}
.ret-luna.ret-step-final .ret-letter{background:#7c3aed}
.ret-luna .ret-next-final{background:#7c3aed}
.ret-guided .ret-stage.ret-stage-3,.ret-writer .ret-stage.ret-stage-3{grid-template-columns:1fr 1fr 1fr}
.ret-guided .ret-stage-final,.ret-writer .ret-stage-final{background:#efe7fb;color:#7c3aed}
.ret-guided .ret-stage-final[aria-selected="true"],.ret-writer .ret-stage-final[aria-selected="true"]{border-color:#7c3aed;background:#7c3aed;color:#fff}
.ret-guided .ret-sec-final .ret-sec-head{background:#efe7fb;color:#5b21b6}
.ret-guided.ret-step-final .ret-lt{background:#7c3aed}
.ret-guided .ret-advance-final,.ret-writer .ret-advance-final{background:#7c3aed}
.ret-writer.ret-step-final .ret-sec h5{color:#5b21b6}

</style>
</head>
<body>

<header class="topbar">
  <button class="logo-chip" title="Home">
    <img src="lonestar-logo.png" alt="LoneStar CR" />
  </button>

  <div style="flex: 1"></div>

  <button class="cc-btn" title="Switch to ClassCade">
    <img src="https://assets.cleark12.com/clearlearning/classcadelogo.png" alt="" onerror="this.nextElementSibling.remove(); this.remove()" />
    <span class="split"></span>
    <span>
      <small>SWITCH TO</small>
      <b>ClassCade</b>
    </span>
  </button>

  <div class="who">
    <div class="av-init">HS</div>
    <div>
      <div class="nm">Henry Scott</div>
      <div class="sub">Dallas Mavs Elementary</div>
    </div>
    <button class="pwr" title="Log out (demo)">⏻</button>
  </div>
</header>

<div class="proto-bar" role="toolbar" aria-label="Prototype controls">
  <strong>Prototype controls</strong>
  <div class="band" id="band" title="Preview by grade band">
    <span>GRADE</span>
    <button data-band="2-3">2–3</button>
    <button data-band="4-5">4–5</button>
    <button data-band="6-8">6–8</button>
    <button data-band="9-12">9–12</button>
  </div>

  <div class="band" id="ptype" title="Prompt type">
    <span>PROMPT</span>
    <button data-ptype="arg">Argumentative</button>
    <button data-ptype="info">Informational</button>
    <button data-ptype="narr">Narrative</button>
    <button data-ptype="corr">Correspondence</button>
  </div>

  <div class="band" id="mode" title="With or without a question set before writing">
    <span>TASK</span>
    <button data-mode="ecr">ECR</button>
    <button data-mode="ecrq">ECR + Q</button>
  </div>

</div>

<div class="assign-bar">
  <h1>Assignment</h1>
  <div class="spacer"></div>
  <button class="save-btn" title="Save and exit">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    <span class="lbl">Save And Exit</span>
  </button>
</div>

<main class="workspace">
  <!-- Passage -->
  <section class="panel">
    <div class="left-tabs" id="leftTabs" role="tablist" aria-label="Passage or checklist" hidden>

let lastEdit = null, lastRange = null;
document.addEventListener('focusin', e => { const el = e.target.closest?.('#step .rte, #step textarea'); if (el) lastEdit = el; });
document.addEventListener('selectionchange', () => {

  const n = sel.anchorNode, host = n && (n.nodeType === 1 ? n : n.parentElement)?.closest?.('#step .rte');

function insertWord(word, tipEl) {
  const el = lastEdit && document.contains(lastEdit) ? lastEdit : null;
  if (!el) { if (tipEl) { tipEl.textContent = 'Click in your writing first, then tap a word.'; tipEl.classList.add('warn'); } return; }
  if (el.tagName === 'TEXTAREA') {
    const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a, before = el.value.slice(0, a);
    const text = (before && !/\s$/.test(before) ? ' ' : '') + word + ' ';
    el.value = before + text + el.value.slice(b); el.focus(); el.selectionStart = el.selectionEnd = a + text.length;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  } else {
    el.focus();
    const sel = getSelection();
    if (lastRange && el.contains(lastRange.startContainer)) { sel.removeAllRanges(); sel.addRange(lastRange); }
    else { const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); sel.removeAllRanges(); sel.addRange(r); }
    const r0 = sel.getRangeAt(0), upTo = document.createRange(); upTo.selectNodeContents(el); upTo.setEnd(r0.startContainer, r0.startOffset);
    const pre = upTo.toString();
    document.execCommand('insertText', false, (pre && !/\s$/.test(pre) ? ' ' : '') + word + ' ');
  }
  if (tipEl) { tipEl.textContent = `Added “${word}”.`; tipEl.classList.remove('warn'); }
}

      const total = set.revise.length + set.edit.length + set.final.length, n = count('revise') + count('edit') + count('final');
      const sub = { revise: 'ARMS', edit: 'CUPS', final: 'Final Check' }[stage], c = { revise: 'rev', edit: 'ed', final: 'final' }[stage];

        <div class="ret-sec ret-sec-${c}">

          <div class="ret-sec-body">${rows.map((t, i) => { const d = isDone(stage, i);

            </div>`; }).join('')}</div>
          ${rows.length ? '' : '<p class="ret-empty">No tips for this section yet.</p>'}
        </div>
        ${stage === 'revise' ? `<button type="button" class="ret-advance ret-advance-ed" data-stage="edit">${complete('revise') ? 'Great revising! Check Editing next →' : 'Check Editing next →'}</button>` : ''}
        ${stage === 'edit' && hasFinal ? `<button type="button" class="ret-advance ret-advance-final" data-stage="final">${complete('edit') ? 'Great editing! Final Check next →' : 'Final Check next →'}</button>` : ''}
        ${((stage === 'edit' && !hasFinal) || stage === 'final') && complete(stage) ? '<p class="ret-complete-note">All checks done. Read your paragraph once more, then you are ready.</p>' : ''}
        ${stage === 'edit' && !hasFinal && !complete('edit') ? '<button type="button" class="ret-advance ret-advance-back" data-stage="revise">← Back to Revise</button>' : ''}
        ${stage === 'final' && !complete('final') ? '<button type="button" class="ret-advance ret-advance-back" data-stage="edit">← Back to Edit</button>' : ''}
        <div class="ret-foot"><button type="button" class="ret-link" data-say="all" aria-pressed="${speakingKey === 'all'}">${ICON.speaker} ${speakingKey === 'all' ? 'Stop' : 'Read this list aloud'}</button><button type="button" class="ret-link" data-view>View Passage Again</button></div>
      </div></div>`;
    } else {
      const nAll = count('revise') + count('edit') + count('final'), tot = set.revise.length + set.edit.length + set.final.length;

      html = `<div class="ret-root"><div class="ret ret-writer ret-step-${stage}" data-band="Writer">

            <div class="ret-top"><div><div class="ret-move">${t.value}</div>${t.hint ? `<div class="ret-what">${t.hint}</div>` : ''}</div>
              <button type="button" class="ret-donebtn" data-toggle="${stage}:${i}" aria-pressed="${d}">${d ? ICON.check('#2f9e63', 14) : ''} Done</button></div>
            ${t.detail ? `<button type="button" class="ret-more" data-how="${id}" aria-expanded="${open}">${open ? 'Hide how' : 'How'}</button><div class="ret-how">${t.detail}</div>` : ''}
          </div>`; }).join('')}</div>${rows.length ? '' : '<p class="ret-empty">No checks for this stage yet.</p>'}</div>

        ${stage === 'edit' && complete('edit') && hasFinal ? '<button type="button" class="ret-advance ret-advance-final" data-stage="final">Editing done. One final check →</button>' : ''}
        ${((stage === 'edit' && !hasFinal) || stage === 'final') && complete(stage) ? '<p class="ret-complete-note">All checks done. Read your draft once more from the top, then submit.</p>' : ''}
        <div class="ret-foot"><span>Checks stay in this session and are not scored.</span><button type="button" class="ret-btn" data-view>View passage</button></div>
      </div></div>`;

  $('revise').innerHTML = html;
  $('revise').querySelectorAll('[data-view]').forEach(b => b.remove());

  R.querySelectorAll('[data-stage]').forEach(b => b.onclick = () => { rv.tab = b.dataset.stage; renderRevise(s); });
  R.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => {
    const [st, i] = b.dataset.toggle.split(':'), k = key(st, +i);
    rv.checked[k] = !rv.checked[k];
    // Grades 4–8: finishing a list moves straight into the next stage
    const nxt = st === 'revise' ? 'edit' : st === 'edit' && hasFinal ? 'final' : null;

  R.querySelectorAll('[data-how]').forEach(b => b.onclick = () => {
    const id = b.dataset.how; rv.openHow = rv.openHow.includes(id) ? rv.openHow.filter(x => x !== id) : [...rv.openHow, id]; renderRevise(s);
  });
  R.querySelectorAll('[data-say]').forEach(b => b.onclick = () => speakTip(sayText[b.dataset.say], b.dataset.say, s));
  R.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { rv.showPassage = true; renderRevise(s); });

// ---------- Question set (ECR + Q) ----------
// Comprehension questions and/or a peer revision task tied to the passage, answered BEFORE the
// writing steps. No Writing Support panel while students work on it. [Sample questions]
const questionSet = LSCR ? LSCR.questions : [
  { kind: "Reading Comprehension", type: "single",
    q: "According to paragraph 2 of Passage 1, why is whispering helpful in a classroom?",
    options: ["It helps students hear the fire alarm.", "It keeps the classroom calm and focused.", "It lets the teacher talk louder.", "It shows that a game is starting."],

  { kind: "Reading Comprehension", type: "multi", pick: 2,
    q: "Which TWO details from Passage 1 show that loud sounds can keep people safe?",
    options: ["A fire alarm tells us to leave the building quickly and safely.", "A ball bouncing tells you someone is playing nearby.", "A referee’s whistle keeps the game fair and safe.", "Music can make us feel happy, sad, or excited."],
    correct: [0, 2], explain: "The fire alarm (paragraph 3) and the referee’s whistle (paragraph 5) both keep people safe." },
  { kind: "Reading Comprehension", type: "single",
    q: "In paragraph 3 of Passage 1, the fire alarm makes a “blaring” sound. What does blaring mean?",
    options: ["Very quiet", "Loud and harsh", "Slow and steady", "Soft and gentle"],
    correct: [1], explain: "A blaring sound is loud and harsh, so everyone notices it." },
  { kind: "Reading Comprehension", type: "single",
    q: "What is the central idea of Passage 2, “The Power of Quiet”?",
    options: ["Quiet places help people rest, focus, and stay safe.", "Libraries should allow loud music.", "Animals do not need quiet to find food.", "Loud noises help people sleep at night."],
    correct: [0], explain: "Each paragraph of Passage 2 explains a way quiet helps people or animals." },
  { kind: "Reading Comprehension", type: "single",
    q: "How are Passage 1 and Passage 2 alike?",
    options: ["Both explain how sounds, or the lack of sound, affect people.", "Both tell a story about a fire drill.", "Both say loud sounds are always bad.", "Both describe how to play a sport."],
    correct: [0], explain: "Passage 1 is about how sounds help us; Passage 2 is about how quiet helps us." },
  { kind: "Peer Revision Task", type: "blanks",
    intro: "While revising a paragraph of your group’s draft argument, you notice that two blank lines need sentences that BEST build on the idea that loud sounds warn people. Read the draft paragraph.",
    para: ["Loud sounds are important because they warn people when something is wrong. A fire alarm tells everyone to leave the building quickly.", "", "", "Without these sounds, people might not know when to act."],
    task: "Move the TWO sentences that BEST build on this idea onto the blank lines.",
    options: ["A referee blows a whistle to stop the game when a player is hurt.", "Soft music can help people fall asleep at night.", "Birds chirp quietly in the trees.", "A car horn warns people who are crossing the street."],
    correct: [0, 3], explain: "The whistle and the car horn both warn people. The other two sentences are about quiet sounds." },
  { kind: "Peer Revision Task", type: "blanks",
    intro: "While revising a paragraph of your group’s draft argument, you notice that two blank lines need sentences that BEST build on the idea that quiet helps people. Read the draft paragraph.",
    para: ["Quiet places help people think and rest. In a library, readers can focus on their books for a long time.", "", "", "Without quiet, it would be harder to learn and feel rested."],
    task: "Move the TWO sentences that BEST build on this idea onto the blank lines.",
    options: ["At night, silence helps our bodies get deep, healthy sleep.", "A fire alarm makes a loud, blaring sound.", "Calm rooms make it easier to pay attention in class.", "A referee blows a whistle during the game."],
    correct: [0, 2], explain: "Sleep and paying attention both show how quiet helps people. The alarm and whistle are loud sounds." },
  { kind: "Peer Revision Task", type: "single",
    intro: "Your group wants to connect two ideas in its draft.",
    q: "“Soft sounds keep a classroom calm. _______, loud sounds like alarms keep people safe.” Which transition BEST completes the sentence?",
    options: ["On the other hand", "For example", "As a result", "First"],
    correct: [0], explain: "“On the other hand” shows the second sentence gives a contrasting idea." },
  { kind: "Peer Revision Task", type: "single",
    intro: "Your group’s draft argues that loud sounds are more important in our daily lives.",
    q: "Which sentence would make the BEST conclusion for the draft?",
    options: ["In conclusion, loud sounds matter most because they warn people and keep them safe.", "Birds chirp in the morning.", "Some people like to listen to music.", "Libraries are quiet places."],
    correct: [0], explain: "A strong conclusion restates the claim and the main reason." }
];
let mode = 'ecr', phase = 'writing', qi = 0;
const qa = questionSet.map(() => ({ sel: [], checked: false }));
const inQuestions = () => mode === 'ecrq' && phase === 'questions';
// Consecutive questions of the same kind form a section ("… · Part B" stays with its question's kind)
function qsGroups() {
  const out = [];
  questionSet.forEach((q, i) => {
    const kind = q.kind.replace(/ · Part .*/, '');
    const last = out[out.length - 1];
    if (last && last.kind === kind) last.idx.push(i);
    else out.push({ kind, cls: /peer/i.test(kind) ? 'peer' : 'rc', idx: [i] });
  });
  return out;
}
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));

function renderQuestions() {
  document.body.classList.add('in-q');
  $('claimStrip').hidden = true; $('midEyebrow').hidden = false;
  $('passage').hidden = false; $('revise').hidden = true;
  if ($('backRv')) $('backRv').remove();
  const q = questionSet[qi], st = qa[qi], n = questionSet.length;
  const right = st.checked && !!q.correct && sameSet(st.sel, q.correct);
  $('midEyebrow').textContent = 'Question set';
  $('stepCount').textContent = `Question ${qi + 1} of ${n}`;
  // Split into sections (Reading Comprehension, Peer Revision Task), each numbered on its own
  const groups = qsGroups(), g = groups.find(x => x.idx.includes(qi)), pos = g.idx.indexOf(qi) + 1;
  $('stepCount').textContent = `${g.kind} · ${pos} of ${g.idx.length}`;
  let html = `<div class="qs-head qs-${g.cls}">
    <div class="qs-sections">${groups.map(x => `<div class="qs-sec qs-${x.cls} ${x === g ? 'on' : ''}">
      <span class="qs-sec-name">${x.kind}${x.idx.every(i => qa[i].checked) ? ' ✓' : ''}</span>
      <div class="qs-steps">${x.idx.map((i, k) => `${k ? '<i></i>' : ''}<button data-q="${i}" class="${qa[i].checked ? 'done' : ''} ${i === qi ? 'active' : ''}" aria-label="${x.kind} question ${k + 1}">${k + 1}</button>`).join('')}</div>
    </div>`).join('')}</div>
    <p class="qs-count">${g.kind} · Question ${pos} of ${g.idx.length}</p></div>`;
  if (q.type === 'blanks') {
    let b = 0;
    const para = q.para.map(t => t ? t : (() => { const o = st.sel[b++]; return o === undefined ? '<span class="qs-blank">&nbsp;</span>' : `<span class="qs-blank filled" data-unfill="${o}" title="Click to remove">${q.options[o]}</span>`; })()).join(' ');
    html += `<p class="qs-intro">${q.intro}</p><div class="qs-para">${para}</div><p class="qs-task">${q.task}</p><p class="qs-kind">Sentence options</p>`;
  } else {
    if (q.intro) html += `<p class="qs-intro">${q.intro}</p>`;
    html += `<div class="qs-q">${q.q}</div>`;
    if (q.type === 'multi') html += `<p class="qs-kind">Choose ${q.pick || 'all that apply'}</p>`;
  }
  if (q.type === 'text') html += `<textarea id="qtext-${qi}" rows="5" placeholder="Write your answer here…" ${st.checked ? 'disabled' : ''} style="margin-bottom:14px">${st.text || ''}</textarea>`;
  if (q.type === 'note') html += `<div class="qs-fb wrong">${q.explain}</div>`;
  const cls = i => (st.checked ? (q.correct.includes(i) ? 'right' : st.sel.includes(i) ? 'wrong' : '') : '') + (st.sel.includes(i) ? ' on' : '');
  if (q.options) html += `<div class="qs-opts ${q.type === 'single' ? 'single one-col' : ''}">${q.options.map((o, i) =>
    `<button class="qs-opt ${cls(i)}" data-opt="${i}" ${st.checked ? 'disabled' : ''} aria-pressed="${st.sel.includes(i)}"><span class="qs-box">✓</span><span>${o}</span></button>`).join('')}</div>`;
  if (st.checked && q.type === 'text') html += q.explain ? `<div class="qs-fb right">${q.explain}</div>` : '';
  else if (st.checked && q.type !== 'note') html += `<div class="qs-fb ${right ? 'right' : 'wrong'}"><b>${right ? 'Correct!' : 'Not quite.'}</b> ${q.explain}</div>`;
  $('step').innerHTML = html;

  if (q.type === 'note') st.checked = true;
  const need = q.type === 'single' ? 1 : q.type === 'multi' ? (q.pick || 1) : 0;
  if ($('qtext-' + qi)) $('qtext-' + qi).oninput = e => { st.text = e.target.value; };
  $('prevBtn').disabled = qi === 0;
  $('nextBtn').disabled = !st.checked && st.sel.length < need;
  $('nextBtn').title = $('nextBtn').disabled ? `Choose ${need === 1 ? 'an answer' : need + ' answers'} first` : '';
  const nextG = groups[groups.indexOf(g) + 1];
  $('nextBtn').textContent = !st.checked ? 'Check answer' : pos < g.idx.length ? 'Next question' : nextG ? `Go to ${nextG.kind} →` : 'Start writing →';

  $('step').querySelectorAll('.qs-opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.opt;
    if (q.type === 'single') st.sel = [i];
    else if (st.sel.includes(i)) st.sel = st.sel.filter(x => x !== i);
    else if (st.sel.length < need) st.sel = [...st.sel, i];
    renderQuestions();
  });
  $('step').querySelectorAll('[data-unfill]').forEach(b => b.onclick = () => {
    if (st.checked) return;
    st.sel = st.sel.filter(x => x !== +b.dataset.unfill); renderQuestions();
  });
  $('step').querySelectorAll('.qs-steps button').forEach(b => b.onclick = () => { qi = +b.dataset.q; renderQuestions(); });
}

const setMode = m => {
  mode = m;
  document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x.dataset.mode === m));
  try { localStorage.setItem('lscr-mode', m); } catch (e) {}
  phase = m === 'ecrq' ? 'questions' : 'writing';
  qi = 0; current = 0;
  renderStep();
};

renderStep();

$('stepper').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.q) { phase = 'questions'; qi = questionSet.length - 1; } else current = +b.dataset.i;
  renderStep();
});
$('prevBtn').onclick = () => {
  if (inQuestions()) { if (qi > 0) qi--; }
  else if (current > 0) current--;
  else if (mode === 'ecrq') { phase = 'questions'; qi = questionSet.length - 1; }
  renderStep();
};
$('nextBtn').onclick = () => {
  if (inQuestions()) {
    const st = qa[qi];
    if (!st.checked) st.checked = true;
    else if (qi < questionSet.length - 1) qi++;
    else { phase = 'writing'; current = 0; }
    return renderStep();
  }
  if (current < assignment.steps.length - 1) { current++; renderStep(); } else openFeedback();
};

function useStarters(which) {
  const i = assignment.steps.findIndex(st => st.organizer), list = startersFor(document.body.dataset.band);
  (which === 'all' ? list.map((_, j) => j) : [which]).forEach(j => {
    const k = ansKey(i, j), cur = answers[k] || '';
    if (!list[j]) return;
    const plain = cur.replace(/<[^>]+>/g, '').trim();
    if (!plain) answers[k] = list[j] + ' ';   // only fills empty boxes; never touches the student's writing
  });
  if (current !== i) current = i;
  renderStep();
}
$('step').addEventListener('click', e => { const b = e.target.closest('[data-starter]'); if (b) useStarters(+b.dataset.starter); });
