$('supports').addEventListener('click', e => {
  if (wordToolClick(e)) return;
  if (e.target.closest('[data-fill-starters]')) return useStarters('all');
  const b = e.target.closest('.support'); if (!b) return;
  const item = b.parentElement, opening = !item.classList.contains('open');
  // one open at a time
  document.querySelectorAll('.support-item').forEach(x => {
    const on = x === item && opening;
    x.classList.toggle('open', on); x.querySelector('.support-body').hidden = !on;
    x.querySelector('.support').setAttribute('aria-expanded', on);
  });
});

// ---------- Highlighting ----------
// Select text in the passage → pick a color. Click a highlight → recolor or remove.
// One highlight can span paragraphs, so its pieces share a data-hid.
let hid = 0, pendingRange = null, editing = null;
const hlConfig = () => { const i = assignment.steps.findIndex(st => st.highlights); return withType(forBand(assignment.steps[i]), i).highlights; };

function wrapRange(range, color) {
  const id = ++hid;
  const walker = document.createTreeWalker($('passage'), NodeFilter.SHOW_TEXT, {
    acceptNode: n => range.intersectsNode(n) && n.textContent.trim() && !n.parentElement.closest('.pnum, summary, .psg-actions')
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP
  });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n => {
    const start = n === range.startContainer ? range.startOffset : 0;
    const end = n === range.endContainer ? range.endOffset : n.length;
    if (start >= end) return;
    if (end < n.length) n.splitText(end);
    const target = start > 0 ? n.splitText(start) : n;
    const m = document.createElement('mark');
    m.className = `hl hl-${color}`; m.dataset.hid = id; m.dataset.color = color;
    target.parentNode.insertBefore(m, target); m.appendChild(target);
  });
}
const piecesOf = id => document.querySelectorAll(`mark[data-hid="${id}"]`);
function removeHl(id) {
  piecesOf(id).forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); m.remove(); p.normalize(); });
}
function updateCounts() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const ids = new Set([...document.querySelectorAll(`#passage mark[data-color="${el.dataset.count}"]`)].map(m => m.dataset.hid));
    el.textContent = ids.size;
  });
}
function showPop(rect, withRemove) {
  const pop = $('hlPop');
  pop.innerHTML = hlConfig().map(h => `<button data-color="${h.color}"><span class="sw hl-${h.color}"></span>${h.label}</button>`).join('')
    + (withRemove ? '<button class="rm" data-remove>Remove</button>' : '');
  pop.classList.add('show');
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let x = Math.min(Math.max(8, rect.left + rect.width / 2 - w / 2), innerWidth - w - 8);
  let y = rect.bottom + 8; if (y + h > innerHeight - 8) y = rect.top - h - 8;
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
}
const hidePop = () => { $('hlPop').classList.remove('show'); pendingRange = null; editing = null; };

$('passage').addEventListener('mouseup', e => setTimeout(() => {
  const sel = getSelection();
  if (sel.isCollapsed || !sel.rangeCount) {
    const m = e.target.closest('mark.hl');
    if (m) { editing = m.dataset.hid; pendingRange = null; showPop(m.getBoundingClientRect(), true); }
    return;
  }
  const r = sel.getRangeAt(0);
  if (!$('passage').contains(r.commonAncestorContainer)) return;
  pendingRange = r.cloneRange(); editing = null;
  showPop(r.getBoundingClientRect(), false);
}));
$('hlPop').addEventListener('mousedown', e => e.preventDefault()); // keep the selection
$('hlPop').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (editing) {
    if (b.hasAttribute('data-remove')) removeHl(editing);
    else piecesOf(editing).forEach(m => { m.className = `hl hl-${b.dataset.color}`; m.dataset.color = b.dataset.color; });
  } else if (pendingRange) {
    wrapRange(pendingRange, b.dataset.color);
    getSelection().removeAllRanges();
  }
  hidePop(); updateCounts();
});
document.addEventListener('mousedown', e => { if (!e.target.closest('#hlPop')) $('hlPop').classList.remove('show'); });
$('passage').addEventListener('scroll', () => $('hlPop').classList.remove('show'));
addEventListener('scroll', () => $('hlPop').classList.remove('show'));

(() => {

    parts.forEach((t, i) => { answers[`o${orgIdx}-${band}-${i}`] = t; }));
  // A few demo highlights in Passage 1
  const demoHl = [
    ["Whispering helps keep the classroom calm and focused.", "green"],
    ["This sound is very important because it tells us to leave the building quickly and safely.", "blue"],
    ["This sound is important for keeping the game fair and safe.", "blue"],
    ["blaring", "red"]
  ];
  demoHl.forEach(([phrase, color]) => {
    const walker = document.createTreeWalker($('passage'), NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const n = walker.currentNode, at = n.textContent.indexOf(phrase);
      if (at < 0 || n.parentElement.closest('mark')) continue;
      const r = document.createRange(); r.setStart(n, at); r.setEnd(n, at + phrase.length);
      wrapRange(r, color); break;
    }
  });
